<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT 生图提示词工坊 (Images 2.5)</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="sp-container">
    <!-- Header -->
    <header class="sp-header">
      <div class="sp-logo">
        <div class="sp-logo-icon">🎨</div>
        <div class="sp-logo-text">
          <div style="display: flex; align-items: center; gap: 6px;">
            <h1>Images 2.5 工坊</h1>
            <span class="sp-status-beacon" id="sp-status-beacon" title="VPS API 正常连接"></span>
          </div>
          <span class="sp-version">官方生产级规范</span>
        </div>
      </div>
      <div class="sp-actions">
        <button id="sp-btn-favorites-toggle" class="sp-icon-btn" title="查看收藏夹">★</button>
        <button id="sp-btn-history-toggle" class="sp-icon-btn" title="查看历史记录">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
          </svg>
        </button>
        <button id="sp-btn-settings" class="sp-icon-btn" title="API 设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="sp-main" id="sp-workspace-view">
      <!-- Integrated Clean Input Box -->
      <div class="sp-input-card">
        <!-- Top Toolbar: Auto-Mode Badge & Hint -->
        <div class="sp-card-topbar">
          <div class="sp-mode-dropdown-wrap">
            <button type="button" class="sp-mode-chip" id="sp-mode-badge" title="点击切换生成模式 (默认AI自动识别)">
              <span id="sp-mode-label">✨ 全新构思</span>
              <span class="sp-chevron">▾</span>
            </button>
            <div class="sp-mode-menu" id="sp-mode-menu" style="display:none;">
              <div class="sp-mode-opt active" data-mode="new">🌟 从头全新构思 (自动)</div>
              <div class="sp-mode-opt" data-mode="reference">🖼️ 垫图参考风格</div>
              <div class="sp-mode-opt" data-mode="edit">🔄 保持稳定局部微调</div>
            </div>
          </div>
          <span class="sp-top-tip">直接按 Ctrl+V 随时贴图</span>
        </div>

        <!-- Textarea -->
        <textarea
          id="sp-rough-input"
          class="sp-textarea"
          rows="2"
          placeholder="输入简略想法，或直接按 Ctrl+V 贴图..."
        ></textarea>

        <!-- Reference Images Miniature Strip (Shown when images exist) -->
        <div class="sp-thumb-strip" id="sp-img-gallery" style="display:none;">
          <div class="sp-thumb-list" id="sp-gallery-list">
            <button type="button" class="sp-thumb-add" id="sp-gallery-add-btn" title="继续粘贴或选图">+</button>
          </div>
          <button type="button" class="sp-strip-clear" id="sp-gallery-clear" title="清空全部参考图">✕ 清空</button>
        </div>

        <!-- Bottom Action Bar inside Input Card -->
        <div class="sp-card-footer">
          <div class="sp-footer-btns">
            <button type="button" class="sp-tool-btn" id="sp-btn-paste-clipboard" title="直接读取剪贴板图片">
              📋 粘贴截图
            </button>
            <button type="button" class="sp-tool-btn" id="sp-btn-browse-file" title="选择本地图片文件">
              📁 选图
            </button>
            <button type="button" class="sp-tool-btn" id="sp-open-sketch" title="打开涂鸦构图板">
              ✏️ 涂鸦
            </button>
            <input type="file" id="sp-file-input" accept="image/*" multiple style="display:none;" />
          </div>
          <span class="sp-img-count" id="sp-gallery-title" style="display:none;">(0/6)</span>
        </div>
      </div>

      <!-- 2D Sketch Board Drawer (Collapsible) -->
      <div class="sp-sketch-box" id="sp-sketch-box" style="display:none;">
        <div class="sp-sketch-header">
          <span>✏️ 空间布局涂鸦板</span>
          <button type="button" class="sp-text-btn" id="sp-close-sketch">✕ 关闭</button>
        </div>
        <div class="sp-sketch-canvas-wrap">
          <canvas id="sp-sketch-canvas" class="sp-sketch-canvas" width="340" height="160"></canvas>
        </div>
        <div class="sp-sketch-tools">
          <div class="sp-sketch-colors">
            <div class="sp-color-dot active" data-color="#1a1a1a" style="background:#1a1a1a;"></div>
            <div class="sp-color-dot" data-color="#64748b" style="background:#64748b;"></div>
            <div class="sp-color-dot" data-color="#2563eb" style="background:#2563eb;"></div>
            <div class="sp-color-dot" data-color="#ef4444" style="background:#ef4444;"></div>
            <div class="sp-color-dot" data-color="#10a37f" style="background:#10a37f;"></div>
            <div class="sp-color-dot" data-color="#ffffff" style="background:#ffffff; border:1px solid #ccc;" title="橡皮擦"></div>
          </div>
          <div class="sp-sketch-actions">
            <button type="button" class="sp-btn-sm" id="sp-sketch-clear">清空</button>
            <button type="button" class="sp-btn-sm sp-btn-sm-primary" id="sp-sketch-confirm">✓ 导入参考图</button>
          </div>
        </div>
      </div>

      <!-- Compact Parameter Capsule Strip (One Single Line!) -->
      <div class="sp-capsule-strip">
        <button type="button" class="sp-capsule-btn active" id="sp-chip-ratio" title="点击更改画幅">
          <span id="sp-chip-ratio-text">📐 16:9 宽幅</span>
          <span class="sp-chevron">▾</span>
        </button>

        <button type="button" class="sp-capsule-btn active" id="sp-chip-style" title="点击更改镜头风格">
          <span id="sp-chip-style-text">🎨 电影级写实</span>
          <span class="sp-chevron">▾</span>
        </button>

        <button type="button" class="sp-capsule-btn active" id="sp-chip-avoid" title="点击配置避坑标签">
          <span id="sp-chip-avoid-text">🚫 避坑 (2)</span>
          <span class="sp-chevron">▾</span>
        </button>
      </div>

      <!-- Popover 1: Aspect Ratio -->
      <div class="sp-popover" id="sp-popover-ratio" style="display:none;">
        <div class="sp-popover-title">
          <span>📐 画幅与景别比例</span>
          <span class="sp-popover-close">✕</span>
        </div>
        <div class="sp-popover-pills" id="sp-ratio-group">
          <button class="sp-ratio-pill" data-ratio="1:1">1:1 方形头像</button>
          <button class="sp-ratio-pill active" data-ratio="16:9">16:9 横版宽幅</button>
          <button class="sp-ratio-pill" data-ratio="9:16">9:16 竖版壁纸</button>
          <button class="sp-ratio-pill" data-ratio="4:3">4:3 经典摄影</button>
          <button class="sp-ratio-pill" data-ratio="21:9">21:9 宽银幕电影</button>
        </div>
      </div>

      <!-- Popover 2: Style Preset -->
      <div class="sp-popover" id="sp-popover-style" style="display:none;">
        <div class="sp-popover-title">
          <span>🎨 艺术与镜头风格</span>
          <span class="sp-popover-close">✕</span>
        </div>
        <div class="sp-popover-pills" id="sp-style-pills">
          <button class="sp-pill active" data-style="photorealistic">📸 电影级写实</button>
          <button class="sp-pill" data-style="3d-render">🧸 3D 盲盒渲染</button>
          <button class="sp-pill" data-style="anime">🌸 日系唯美动漫</button>
          <button class="sp-pill" data-style="cyberpunk">⚡ 赛博朋克未来</button>
          <button class="sp-pill" data-style="minimalist">🌿 现代极简艺术</button>
          <button class="sp-pill" data-style="oil-painting">🎨 古典厚涂油画</button>
          <button class="sp-pill" data-style="commercial">💎 商业广告大片</button>
        </div>
      </div>

      <!-- Popover 3: Avoid Constraints -->
      <div class="sp-popover" id="sp-popover-avoid" style="display:none;">
        <div class="sp-popover-title">
          <span>🚫 严禁与避坑约束 (多选)</span>
          <span class="sp-popover-close">✕</span>
        </div>
        <div class="sp-popover-pills" id="sp-avoid-group">
          <button class="sp-avoid-pill active" data-avoid="无乱码文字或水印 (no text artifacts/watermarks)">🔤 无乱码文字水印</button>
          <button class="sp-avoid-pill active" data-avoid="肢体结构正常手部精细 (anatomically correct hands and fingers)">✋ 规避手指畸形</button>
          <button class="sp-avoid-pill" data-avoid="背景纯净无杂乱干扰 (clean uncluttered background)">🧹 纯净不杂乱</button>
          <button class="sp-avoid-pill" data-avoid="避免廉价塑料CG质感 (avoid cheap plastic 3d gloss)">✨ 拒绝塑料CG假感</button>
          <button class="sp-avoid-pill" data-avoid="画面清晰拒绝低分辨率模糊 (no blurry or pixelated details)">🔍 拒绝低清模糊</button>
        </div>
      </div>

      <!-- Generate Button -->
      <div class="sp-action-area">
        <button class="sp-btn-primary" id="sp-btn-generate">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.5 5.6L10 0l2.5 5.6L18 7.5 12.5 10l-2.5 5.6L7.5 10 2 7.5l5.5-1.9zm12 9.4l1.5-3.4 1.5 3.4 3.4 1.5-3.4 1.5-1.5 3.4-1.5-3.4-3.4-1.5 3.4-1.5z"/>
          </svg>
          <span id="sp-gen-text">一键生成 Images 2.5 提示词</span>
        </button>
      </div>

      <!-- Result Card (Renders directly into view without scrolling!) -->
      <section class="sp-result-card" id="sp-result-card" style="display:none;">
        <div class="sp-result-header">
          <div class="sp-result-badge">✨ 优化后生产级 Prompt</div>
          <div style="display: flex; gap: 6px; align-items: center;">
            <button class="sp-star-btn" id="sp-btn-star" title="收藏此提示词">
              <span class="pm-star-icon">★</span>
              <span class="sp-star-text">收藏</span>
            </button>
            <button class="sp-btn-copy" id="sp-btn-copy-main">📋 一键复制</button>
          </div>
        </div>
        <div class="sp-prompt-output" id="sp-prompt-output"></div>

        <!-- Breakdown Accordion -->
        <div class="sp-breakdown-card">
          <div class="sp-breakdown-title">
            <span>🔍 结构化要素拆解 (Official Brief)</span>
          </div>
          <div class="sp-breakdown-body" id="sp-breakdown-body"></div>
        </div>

        <!-- Alternative Variations -->
        <div class="sp-variations" id="sp-variations" style="display:none;">
          <div class="sp-variations-title">💡 备选变体版本</div>
          <div class="sp-variations-list" id="sp-variations-list"></div>
        </div>
      </section>
    </main>

    <!-- History Drawer View -->
    <div class="sp-history-view" id="sp-history-view" style="display:none;">
      <div class="sp-history-header">
        <h2>生成历史记录</h2>
        <div class="sp-history-actions">
          <button id="sp-btn-clear-history" class="sp-text-btn-danger">清空</button>
          <button id="sp-btn-close-history" class="sp-icon-btn">✕</button>
        </div>
      </div>
      <div class="sp-history-list" id="sp-history-list">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- Favorites Drawer View -->
    <div class="sp-history-view" id="sp-favorites-view" style="display:none;">
      <div class="sp-history-header">
        <h2>⭐ 我的收藏夹</h2>
        <div class="sp-history-actions">
          <button id="sp-btn-close-favorites" class="sp-icon-btn">✕</button>
        </div>
      </div>
      <div class="sp-history-list" id="sp-favorites-list">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="sp-toast" id="sp-toast"></div>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="../lib/prompt-engine.js"></script>
  <script src="../lib/api-client.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
