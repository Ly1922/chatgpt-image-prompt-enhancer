!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT 生图提示词工坊 (Images 2.5)</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="sp-container">
    <!-- Header -->
    <header class="sp-header">
      <div class="sp-logo">
        <div class="sp-logo-icon">🎨</div>
        <div class="sp-logo-text">
          <h1>Images 2.5 提示词工坊</h1>
          <span class="sp-version">官方生产级规范</span>
        </div>
      </div>
      <div class="sp-actions">
        <button id="sp-btn-history-toggle" class="sp-icon-btn" title="查看历史记录">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
          </svg>
        </button>
        <button id="sp-btn-settings" class="sp-icon-btn" title="配置 API 与模型">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="sp-main" id="sp-workspace-view">
      <!-- Mode Tabs -->
      <div class="sp-mode-tabs">
        <button class="sp-mode-tab active" data-mode="new">🌟 全新构思</button>
        <button class="sp-mode-tab" data-mode="reference">🖼️ 垫图参考</button>
        <button class="sp-mode-tab" data-mode="edit">🔄 局部微调 (稳定)</button>
      </div>

      <!-- Image Reference Zone -->
      <section class="sp-section">
        <div class="sp-dropzone" id="sp-dropzone">
          <div class="sp-dropzone-content">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p><strong>拖拽多张图片至此</strong> 或点击批量上传</p>
            <span class="sp-dropzone-sub">支持同时多选、截图连续粘贴 (Ctrl+V)</span>
          </div>
          <input type="file" id="sp-file-input" accept="image/*" multiple style="display:none;" />
        </div>

        <div class="sp-img-gallery" id="sp-img-gallery" style="display:none;">
          <div class="sp-gallery-header">
            <span id="sp-gallery-title">已载入参考图 (0/6)</span>
            <button type="button" class="sp-text-btn-danger" id="sp-gallery-clear">清空全部</button>
          </div>
          <div class="sp-gallery-list" id="sp-gallery-list">
            <!-- Dynamically populated -->
            <div class="sp-gallery-add" id="sp-gallery-add-btn" title="添加更多参考图">
              <span style="font-size: 16px;">+</span>
              <span>加图</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Rough Prompt Input -->
      <section class="sp-section">
        <label class="sp-label" for="sp-rough-input">
          <span>粗略想法 / 简写意图</span>
          <span class="sp-label-hint">越随意越省心，AI 帮你扩写</span>
        </label>
        <div class="sp-input-wrap">
          <textarea
            id="sp-rough-input"
            class="sp-textarea"
            rows="3"
            placeholder="例如：一个穿西装的柴犬在东京街头端着一杯咖啡，雨后倒影，微距摄影..."
          ></textarea>
        </div>
      </section>

      <!-- Quick Style Presets -->
      <section class="sp-section">
        <label class="sp-label">艺术与镜头风格</label>
        <div class="sp-pills-wrap" id="sp-style-pills">
          <button class="sp-pill active" data-style="photorealistic">📸 电影级写实</button>
          <button class="sp-pill" data-style="3d-render">🧸 3D 盲盒渲染</button>
          <button class="sp-pill" data-style="anime">🌸 日系唯美动漫</button>
          <button class="sp-pill" data-style="cyberpunk">⚡ 赛博朋克未来</button>
          <button class="sp-pill" data-style="minimalist">🌿 现代极简艺术</button>
          <button class="sp-pill" data-style="oil-painting">🎨 古典厚涂油画</button>
          <button class="sp-pill" data-style="commercial">💎 商业广告大片</button>
        </div>
      </section>

      <!-- Generate Button -->
      <div class="sp-action-area">
        <button class="sp-btn-primary" id="sp-btn-generate">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.5 5.6L10 0l2.5 5.6L18 7.5 12.5 10l-2.5 5.6L7.5 10 2 7.5l5.5-1.9zm12 9.4l1.5-3.4 1.5 3.4 3.4 1.5-3.4 1.5-1.5 3.4-1.5-3.4-3.4-1.5 3.4-1.5z"/>
          </svg>
          <span id="sp-gen-text">一键生成 Images 2.5 结构化提示词</span>
        </button>
      </div>

      <!-- Result Card -->
      <section class="sp-result-card" id="sp-result-card" style="display:none;">
        <div class="sp-result-header">
          <div class="sp-result-badge">✨ 优化后生产级 Prompt</div>
          <button class="sp-btn-copy" id="sp-btn-copy-main">📋 一键复制</button>
        </div>
        <div class="sp-prompt-output" id="sp-prompt-output"></div>

        <!-- Breakdown Accordion -->
        <div class="sp-breakdown-card">
          <div class="sp-breakdown-title">
            <span>🔍 结构化要素拆解 (Official Brief)</span>
          </div>
          <div class="sp-breakdown-body" id="sp-breakdown-body"></div>
        </div>

        <!-- Alternative Variations -->
        <div class="sp-variations" id="sp-variations" style="display:none;">
          <div class="sp-variations-title">💡 备选变体版本</div>
          <div class="sp-variations-list" id="sp-variations-list"></div>
        </div>
      </section>
    </main>

    <!-- History Drawer View -->
    <div class="sp-history-view" id="sp-history-view" style="display:none;">
      <div class="sp-history-header">
        <h2>生成历史记录</h2>
        <div class="sp-history-actions">
          <button id="sp-btn-clear-history" class="sp-text-btn-danger">清空</button>
          <button id="sp-btn-close-history" class="sp-icon-btn">✕</button>
        </div>
      </div>
      <div class="sp-history-list" id="sp-history-list">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="sp-toast" id="sp-toast"></div>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="../lib/prompt-engine.js"></script>
  <script src="../lib/api-client.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
